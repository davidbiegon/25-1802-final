<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
        }

        h1 {
            margin: 0;
        }

        .projects {
            padding: 40px;
        }

        .card {
            background: white;
            margin: 15px auto;
            padding: 20px;
            width: 60%;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        .card a {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .card a:hover {
            background-color: brown;
        }
    </style>
</head>

<body>

<header>
    <h1>My Projects Portfolio</h1>
    <p>Welcome to my collection of websites</p>
</header>

<section class="projects">

    <div class="card">
        <h2>Project 1</h2>
        <p>My first website project.</p>
        <a href="https://username.github.io/repo1/" target="_blank">View Project</a>
    </div>

    <div class="card">
        <h2>Project 2</h2>
        <p>Another HTML/CSS project.</p>
        <a href="https://username.github.io/repo2/" target="_blank">View Project</a>
    </div>

    <div class="card">
        <h2>GitHub Repository</h2>
        <p>View my source code.</p>
        <a href="https://github.com/username" target="_blank">View GitHub</a>
    </div>

</section>

</body>
</html>
